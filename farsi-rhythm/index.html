<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>فارسي بالإيقاع</title>
<meta name="description" content="تعلّم أهم ٦٠٠ كلمة فارسية بالغناء والإيقاع — للمتحدثين بالعربية" />
<meta name="theme-color" content="#6d28d9" />
<meta name="referrer" content="no-referrer" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="فارسي بالإيقاع" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="apple-touch-icon" href="icon.png" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎵</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800;900&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#fdf8ff; --bg2:#f3e8ff; --card:#ffffff; --text:#2a1846; --muted:#6b5a85; --border:#e7dcf5;
  --brand:#7c3aed; --brand2:#ec4899; --ok:#16a34a; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2;
  --warn:#f59e0b; --shadow:0 6px 20px rgba(76,29,149,.10); --chip:#f5f0ff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#140d24; --bg2:#1f1538; --card:#221a3a; --text:#f4efff; --muted:#b5a8d6; --border:#3a2e5c;
    --brand:#a78bfa; --brand2:#f472b6; --ok:#4ade80; --okbg:#14361f; --bad:#f87171; --badbg:#3d1717;
    --shadow:0 6px 20px rgba(0,0,0,.35); --chip:#2c2250;
  }
}
:root[data-theme="dark"]{
  --bg:#140d24; --bg2:#1f1538; --card:#221a3a; --text:#f4efff; --muted:#b5a8d6; --border:#3a2e5c;
  --brand:#a78bfa; --brand2:#f472b6; --ok:#4ade80; --okbg:#14361f; --bad:#f87171; --badbg:#3d1717;
  --shadow:0 6px 20px rgba(0,0,0,.35); --chip:#2c2250;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{
  background:radial-gradient(900px 500px at 100% 0%, var(--bg2), transparent 70%), var(--bg);
  color:var(--text); min-height:100vh;
  font-family:"Vazirmatn", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:860px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(60px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.btn{
  appearance:none;border:0;border-radius:16px;padding:12px 18px;font-weight:800;font-size:16px;
  background:var(--brand);color:#fff;box-shadow:var(--shadow);transition:transform .08s;
}
.btn:active{transform:scale(.97)}
.btn.alt{background:var(--card);color:var(--text);border:1.5px solid var(--border);box-shadow:none}
.btn.pink{background:linear-gradient(135deg,var(--brand),var(--brand2))}
.btn.big{font-size:20px;padding:16px 24px;border-radius:20px}
.btn.sm{font-size:14px;padding:8px 12px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.center{justify-content:center;text-align:center}
.card{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:13px}
h1{font-size:26px;margin:0;font-weight:900}
h2{font-size:20px;margin:0 0 10px;font-weight:900}
h3{font-size:17px;margin:0 0 6px}
.stack>*+*{margin-top:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.logo{display:flex;align-items:center;gap:10px}
.logo .em{font-size:38px}
.iconbtn{appearance:none;border:1px solid var(--border);background:var(--card);border-radius:14px;width:44px;height:44px;font-size:20px}

/* hero / challenge */
.hero{background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff;border:0}
.hero .muted{color:rgba(255,255,255,.85)}
.hero .btn{background:#fff;color:#6d28d9}
.blocks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.block{border:2px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:14px;padding:10px 6px;font-weight:800;font-size:14px}
.block.sel{background:#fff;color:#6d28d9;border-color:#fff}
.block .bar{height:5px;background:rgba(255,255,255,.3);border-radius:4px;margin-top:6px;overflow:hidden}
.block.sel .bar{background:#ede9fe}
.block .bar i{display:block;height:100%;background:#facc15}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:620px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{text-align:center;padding:12px 8px}
.stat b{display:block;font-size:24px;font-weight:900;color:var(--brand)}

.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lesson{appearance:none;text-align:right;border:1px solid var(--border);background:var(--card);border-radius:18px;padding:12px}
.lesson .em{font-size:30px}
.lesson .t{font-weight:800;font-size:15px;margin:4px 0}
.prog{height:6px;background:var(--chip);border-radius:6px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2))}

.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.wcard{appearance:none;border:1px solid var(--border);background:var(--card);border-radius:18px;padding:12px;text-align:center;position:relative}
.wcard .em{font-size:40px;line-height:1.2}
.fa{font-weight:800;font-size:22px;direction:rtl}
.wcard .ar{color:var(--muted);font-size:14px}
.wcard .done{position:absolute;top:6px;left:8px;font-size:14px}
.acts{display:flex;gap:6px;justify-content:center;margin-top:8px}
.acts.col{flex-direction:column}
.say{appearance:none;border:0;border-radius:12px;padding:8px 12px;font-weight:800;font-size:15px;background:var(--brand);color:#fff;min-width:44px;min-height:40px}
.say.alt{background:var(--chip);color:var(--text)}
.say.on{background:var(--brand2);color:#fff;animation:pulse 1s infinite}
.stage{position:relative}
.say.replay{position:absolute;top:10px;left:10px}
.pausebtn{appearance:none;border:0;border-radius:14px;height:44px;padding:0 12px;font-weight:900;font-size:15px;background:var(--warn);color:#3b2a07;white-space:nowrap}
.overlay{position:fixed;inset:0;z-index:20;background:rgba(20,13,36,.55);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.15);padding:4px;border-radius:14px;margin-bottom:12px}
.tab{appearance:none;flex:1;border:0;border-radius:11px;padding:9px 6px;font-weight:800;font-size:14px;background:none;color:#fff}
.tab.sel{background:#fff;color:#6d28d9}
.built{min-height:58px;width:100%;border:2px dashed var(--border);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;direction:rtl}
.built.ok{border-color:var(--ok);background:var(--okbg)} .built.bad{border-color:var(--bad);background:var(--badbg)}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;direction:rtl}
.tile{appearance:none;border:2px solid var(--border);background:var(--card);border-radius:12px;padding:8px 12px;font-size:20px;font-weight:800}
.tile.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.sent{position:relative} .sent .done{position:absolute;top:6px;left:8px;font-size:14px}
.sent{appearance:none;width:100%;text-align:right;border:1px solid var(--border);background:var(--card);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.sent .em{font-size:24px;white-space:nowrap}
.sent .fa{font-size:18px}
.hl{color:var(--brand);border-bottom:3px solid var(--brand2)}
.features{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.feat{appearance:none;border:1px solid var(--border);background:var(--card);border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;box-shadow:var(--shadow)}
.feat .em{font-size:30px} .feat:disabled{opacity:.6}
.resume{border:2px solid var(--brand2)}
.stagecard{background:linear-gradient(135deg,var(--chip),var(--card));border:2px dashed var(--brand)}
.qprompt{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.blank{display:inline-block;min-width:70px;border-bottom:3px dashed var(--brand2);color:var(--brand2);font-weight:900}
.analogy{display:flex;gap:6px;align-items:center;flex-wrap:nowrap;justify-content:center;font-size:20px;direction:rtl;white-space:nowrap}
.stage [data-k="read"]{padding:6px 10px;border-radius:14px;transition:all .2s}
.stage [data-k="read"].sing{background:var(--chip);color:inherit;transform:none;box-shadow:0 0 0 3px var(--brand2) inset}
@media (max-width:520px){.features .small{font-size:11px}}
.lyric{appearance:none;display:block;width:100%;text-align:right;border:0;background:none;border-radius:14px;padding:8px 12px;margin:2px 0;transition:background .2s,transform .2s}
.lyric .fa{font-size:20px}
.lyric.now{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;transform:scale(1.02)}
.lyric.now .muted,.lyric.now .hl{color:#fff;border-color:#fff}
details>summary{list-style:none} details>summary::-webkit-details-marker{display:none}

/* stage */
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.timer{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:900;font-size:22px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:6px 14px}
.timer.low{color:var(--bad)}
.pill{background:var(--chip);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
.dots{display:flex;gap:8px;justify-content:center;margin:6px 0 14px}
.dots span{width:14px;height:14px;border-radius:50%;background:var(--chip);transition:transform .1s,background .1s}
.dots span.on{background:var(--brand2);transform:scale(1.35)}
.dots span.on.down{background:var(--brand)}
.stage{text-align:center;padding:22px 16px;min-height:340px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px}
.stage .em{font-size:96px;line-height:1.1;transition:transform .12s}
.stage .em.bump{transform:scale(1.15) rotate(-4deg)}
.stage .fa{font-size:44px;transition:all .15s;padding:0 10px;border-radius:14px}
.stage .ar{font-size:22px;color:var(--muted);transition:all .15s;padding:0 10px;border-radius:12px}
.stage .sing{color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));transform:scale(1.08)}
.stage .sfa{font-size:26px;font-weight:800;line-height:1.7;transition:all .15s;padding:2px 10px;border-radius:12px}
.stage .sar{font-size:18px;color:var(--muted);transition:all .15s;padding:2px 10px;border-radius:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{background:var(--chip);border-radius:999px;padding:4px 10px;font-size:14px;font-weight:700}
.chip.cur{background:var(--brand);color:#fff}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.bad{background:var(--badbg);color:var(--bad)}
.tag{font-size:13px;font-weight:800;color:var(--brand);letter-spacing:.3px}

/* quiz */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-top:8px}
.opt{appearance:none;border:2px solid var(--border);background:var(--card);border-radius:18px;padding:14px 8px;font-weight:800;font-size:17px;display:flex;flex-direction:column;align-items:center;gap:4px}
.opt .em{font-size:40px}
.opt.wide{grid-column:1/-1;flex-direction:row;justify-content:center;font-size:17px;padding:14px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.play{appearance:none;border:0;width:96px;height:96px;border-radius:50%;font-size:42px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:var(--shadow)}
.mic{appearance:none;border:0;width:110px;height:110px;border-radius:50%;font-size:48px;background:var(--brand);color:#fff;box-shadow:var(--shadow)}
.mic.on{animation:pulse 1s infinite;background:var(--bad)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.5)}100%{box-shadow:0 0 0 26px rgba(220,38,38,0)}}
.meter{width:100%;max-width:340px;height:14px;border-radius:10px;background:var(--chip);overflow:hidden}
.meter i{display:block;height:100%;transition:width .4s}
.fb{font-weight:900;font-size:20px;min-height:30px}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}

/* report */
.bignum{font-size:56px;font-weight:900;color:var(--brand);line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.notice{border-radius:16px;padding:12px 14px;background:var(--chip);font-size:14px;line-height:1.7}
.notice.warn{background:#fef3c7;color:#78350f}
:root[data-theme="dark"] .notice.warn{background:#3b2a07;color:#fde68a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .notice.warn{background:#3b2a07;color:#fde68a}}
label.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
label.set:last-child{border-bottom:0}
select,input[type=range]{font:inherit}
select{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:6px 8px;max-width:55%}
input[type=range]{width:45%;accent-color:var(--brand)}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--brand)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.confetti i{position:absolute;top:-30px;font-size:26px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (max-width:520px){
  .stage .em{font-size:78px} .stage .fa{font-size:36px} .stage .sfa{font-size:22px}
  .blocks{grid-template-columns:repeat(2,1fr)} h1{font-size:22px}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="data.js"></script>
<script src="songs.js"></script>
<script src="app.js"></script>
</body>
</html>
