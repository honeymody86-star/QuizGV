<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>المعلّم المرئي</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Kalam:wght@700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0f1222; --panel:#181c33; --text:#f3f5ff; --muted:#a7adc9; --accent:#7c5cff; --accent2:#ff3b6b;
  --board:#fbfaf6; --line:rgba(255,255,255,.12);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:Cairo,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center}
.app{width:100%;max-width:980px;min-height:100%;display:flex;flex-direction:column;padding:12px 16px calc(12px + env(safe-area-inset-bottom));gap:10px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:19px;margin:0;font-weight:900;display:flex;align-items:center;gap:8px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#b18cff);display:grid;place-items:center;font-size:17px}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;height:38px;min-width:38px;padding:0 10px;font:inherit;font-weight:700;cursor:pointer}
.iconbtn:disabled{opacity:.4;cursor:default}
.stage{flex:none;position:relative;background:var(--board);border-radius:18px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.45),inset 0 0 0 10px #2b2f45;aspect-ratio:1000/620}
.stage svg{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px)}
.stage .empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#6b7280;padding:24px;font-weight:700;line-height:1.8}
.stage .badge{position:absolute;top:16px;left:16px;background:rgba(15,18,34,.8);color:#fff;font-size:12px;padding:4px 10px;border-radius:999px;display:none}
.progress{display:flex;gap:4px;height:4px}
.progress i{flex:1;border-radius:4px;background:var(--line)}
.progress i.done{background:var(--accent)}
.progress i.cur{background:linear-gradient(90deg,var(--accent2),var(--accent))}
.subtitle{min-height:72px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:19px;line-height:1.75;font-weight:600;color:var(--muted)}
.subtitle span{transition:color .15s}
.subtitle span.said{color:var(--text)}
.subtitle span.on{color:#fff;background:linear-gradient(transparent 55%,rgba(255,59,107,.55) 0);border-radius:3px}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.status{font-size:13px;color:var(--muted);flex:1;min-width:150px}
.status.err{color:#ff8fa8}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px dashed rgba(124,92,255,.6);background:rgba(124,92,255,.1);color:var(--text);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.ask{display:flex;gap:8px;align-items:center;background:#fff;border-radius:999px;padding:6px;position:sticky;bottom:10px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.ask input[type=text]{flex:1;border:0;outline:0;font:inherit;font-size:16px;padding:8px 10px;background:transparent;color:#111;min-width:0}
.ask .round{width:42px;height:42px;border-radius:50%;border:0;display:grid;place-items:center;cursor:pointer;font-size:18px;flex:none}
.ask .send{background:var(--accent2);color:#fff}
.ask .mic{background:#eef0f7;color:#111}
.ask .mic.rec{background:var(--accent2);color:#fff;animation:pulse 1s infinite}
.ask .cam{background:#eef0f7;color:#111;position:relative;overflow:hidden}
.ask .cam input{position:absolute;inset:0;opacity:0;cursor:pointer}
.ask .cam.has{background:#d9f99d}
@keyframes pulse{50%{transform:scale(1.08)}}
.cost{font-size:12px;color:var(--muted);text-align:center}
dialog{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:18px;width:min(560px,calc(100vw - 32px));padding:0}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog form{padding:18px;display:grid;gap:12px;max-height:85vh;overflow:auto}
dialog h2{margin:0;font-size:18px}
dialog fieldset{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:8px}
dialog legend{font-weight:800;padding:0 6px}
dialog label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
dialog input,dialog select{font:inherit;font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#0f1222;color:var(--text)}
dialog .row{display:flex;gap:8px}
dialog .row>*{flex:1}
dialog .hint{font-size:12px;color:var(--muted);line-height:1.6}
dialog .actions{display:flex;gap:8px;justify-content:flex-start}
dialog .primary{background:var(--accent);border-color:transparent}
.hide{display:none!important}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><span class="logo">🎓</span> المعلّم المرئي</h1>
    <div style="display:flex;gap:6px">
      <button class="iconbtn" id="btnSettings" title="الإعدادات">⚙️</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <svg id="board" aria-label="السبورة"></svg>
    <div class="empty" id="empty">اسأل أي سؤال دراسي ✍️<br/>وسأشرحه لك بصوت بشري ورسوم تُرسم أمامك في نفس اللحظة</div>
    <div class="badge" id="badge"></div>
  </div>
  <div class="progress" id="progress"></div>
  <div class="subtitle" id="subtitle"></div>

  <div class="controls">
    <button class="iconbtn" id="btnPause" disabled>⏸</button>
    <button class="iconbtn" id="btnReplay" disabled>↻ إعادة</button>
    <select class="iconbtn" id="rate" title="سرعة الشرح">
      <option value="0.9">0.9×</option><option value="1" selected>1×</option><option value="1.15">1.15×</option><option value="1.3">1.3×</option>
    </select>
    <div class="status" id="status">جاهز</div>
  </div>

  <div class="chips" id="chips"></div>

  <form class="ask" id="askForm" autocomplete="off">
    <button type="button" class="round mic" id="btnMic" title="اسأل بصوتك">🎙️</button>
    <label class="round cam" id="camLbl" title="صوّر سؤالك">📷<input type="file" accept="image/*" capture="environment" id="file" /></label>
    <input type="text" id="q" placeholder="اسألني أي شيء..." />
    <button type="submit" class="round send" title="اشرح">➤</button>
  </form>
  <div class="cost" id="cost"></div>
</div>

<dialog id="dlg">
  <form method="dialog" id="settingsForm">
    <h2>⚙️ الإعدادات</h2>

    <fieldset>
      <legend>عقل المعلّم (Claude)</legend>
      <label>طريقة الاتصال
        <select name="mode">
          <option value="direct">مباشرة من المتصفح بمفتاحي (للتجربة الشخصية)</option>
          <option value="server">عبر خادمي الوسيط (للنشر للعامة)</option>
        </select>
      </label>
      <label data-mode="direct">مفتاح Claude API <input name="apiKey" type="password" placeholder="sk-ant-..." /></label>
      <label data-mode="server">رابط الخادم الوسيط <input name="serverUrl" type="url" placeholder="https://tutor.yourname.workers.dev" /></label>
      <label>النموذج
        <select name="model">
          <option value="claude-opus-5-5">Claude Opus 5.5 — أعلى جودة شرح</option>
          <option value="claude-sonnet-5-5">Claude Sonnet 5.5 — متوازن (نصف السعر)</option>
          <option value="claude-haiku-5-5">Claude Haiku 5.5 — الأرخص والأسرع</option>
        </select>
      </label>
    </fieldset>

    <fieldset>
      <legend>الصوت</legend>
      <label>مزوّد الصوت
        <select name="tts">
          <option value="browser">صوت المتصفح — مجاني (أفضل في Edge وSafari)</option>
          <option value="azure">Azure Neural — أفضل سعر مقابل الجودة</option>
          <option value="elevenlabs">ElevenLabs — الأكثر بشرية + تزامن دقيق</option>
          <option value="openai">OpenAI gpt-4o-mini-tts — نبرة قابلة للتوجيه</option>
          <option value="server">عبر الخادم الوسيط</option>
        </select>
      </label>
      <div data-tts="browser"><label>صوت المتصفح <select name="browserVoice"></select></label></div>
      <div data-tts="azure" class="row">
        <label>مفتاح Azure Speech <input name="azureKey" type="password" /></label>
        <label>المنطقة <input name="azureRegion" placeholder="westeurope" /></label>
      </div>
      <div data-tts="azure"><label>الصوت
        <select name="azureVoice">
          <option>ar-SA-HamedNeural</option><option>ar-SA-ZariyahNeural</option><option>ar-EG-SalmaNeural</option>
          <option>ar-EG-ShakirNeural</option><option>ar-AE-FatimaNeural</option><option>ar-KW-FahedNeural</option>
        </select></label></div>
      <div data-tts="elevenlabs" class="row">
        <label>مفتاح ElevenLabs <input name="elevenKey" type="password" /></label>
        <label>Voice ID <input name="elevenVoice" placeholder="اختر صوتاً عربياً من المكتبة" /></label>
      </div>
      <div data-tts="elevenlabs"><label>الموديل
        <select name="elevenModel">
          <option value="eleven_multilingual_v2">Multilingual v2 — أجود</option>
          <option value="eleven_flash_v2_5">Flash v2.5 — نصف السعر وأسرع</option>
        </select></label></div>
      <div data-tts="openai" class="row">
        <label>مفتاح OpenAI <input name="openaiKey" type="password" /></label>
        <label>الصوت <select name="openaiVoice"><option>coral</option><option>ash</option><option>sage</option><option>ballad</option><option>verse</option><option>alloy</option></select></label>
      </div>
      <p class="hint">المفاتيح تُحفظ في متصفحك فقط. لا تنشر التطبيق للعامة بمفاتيح داخل المتصفح؛ استخدم الخادم الوسيط (worker/).</p>
    </fieldset>

    <div class="actions">
      <button class="iconbtn primary" value="save">حفظ</button>
      <button class="iconbtn" value="cancel">إلغاء</button>
    </div>
  </form>
</dialog>

<script type="module" src="./app.js"></script>
</body>
</html>
