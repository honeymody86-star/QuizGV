<html lang="ar" dir="rtl">
<head>

<title>أدوات الاختبارات — القواعد والمفردات</title>
<style>
:root {
  --bg:#0b1020; --card:rgba(255,255,255,0.06); --card2:rgba(255,255,255,0.10);
  --text:#f2f5ff; --muted:rgba(242,245,255,0.75); --border:rgba(255,255,255,0.14);
}
*{box-sizing:border-box}
body{
  margin:0; padding:18px; min-height:100vh; color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;
  background: radial-gradient(1200px 700px at 10% 10%, rgba(96,165,250,0.18), transparent 60%),
              radial-gradient(1000px 600px at 90% 20%, rgba(34,197,94,0.12), transparent 60%),
              radial-gradient(900px 600px at 60% 90%, rgba(239,68,68,0.10), transparent 60%),
              var(--bg);
}
.wrap{max-width:1200px;margin:0 auto}
.top{
  display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between;
  margin-bottom:12px;
}
h1{font-size:18px;margin:0}
.sub{font-size:12px;color:var(--muted);line-height:1.5}
.bar{display:flex;gap:10px;flex-wrap:wrap}
button{
  appearance:none;border:1px solid var(--border);background:var(--card2);color:var(--text);
  border-radius:14px;padding:10px 12px;cursor:pointer;font-weight:800;font-size:14px;
}
button:hover{border-color:rgba(255,255,255,0.25)}
button.active{background:rgba(96,165,250,0.22); border-color: rgba(96,165,250,0.55);}
.frameWrap{border:1px solid var(--border); border-radius:16px; overflow:hidden; background:var(--card);}
iframe{width:100%; height:84vh; border:0; background:white;}
.note{margin-top:10px;font-size:12px;color:var(--muted)}
a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>أدوات الاختبارات (زر واحد للطلاب)</h1>

: "drinking"}], "correct": "drinking", "explanation": "الفعل drinkingصحيح لأن (stop + gerund) تعني التوقف عن الفعل."}, {"question": "13. Can I have ________ piece of cake?", "options": [{"key": "A", "text": "another"}, {"key": "B", "text": "other"}, {"key": "C", "text": "others"}, {"key": "D", "text": "those"}], "correct": "another", "explanation": "الكلمة anotherتعني واحد إضافي مفرد. باقي الاختيارات جمع أو إشارة."}, {"question": "14. I don’t eat fast food, but my friend ________.", "options": [{"key": "A", "text": "do"}, {"key": "B", "text": "did"}, {"key": "C", "text": "does"}, {"key": "D", "text": "is"}], "correct": "does", "explanation": "الفعل doesيُستخدم كفعل مساعد بدل تكرار الفعل بعد (but) (do) للجمع، (did) زمن مختلف."}, {"question": "15. He has lived here ________ five years.", "options": [{"key": "A", "text": "yet"}, {"key": "B", "text": "since"}, {"key": "C", "text": "for"}, {"key": "D", "text": "to"}], "correct": "for", "explanation": "حرف الجر for يُستخدم مع مدة زمنية. (since) نقطة زمنية."}, {"question": "16. She has studied English ________ the age of ten.", "options": [{"key": "A", "text": "to"}, {"key": "B", "text": "yet"}, {"key": "C", "text": "for"}, {"key": "D", "text": "since"}], "correct": "since", "explanation": "حرف الجر sinceيُستخدم مع نقطة زمنية محددة."}], "model2": [{"question": "1. ________ your parents work in the same company?", "options": [{"key": "A", "text": "Does"}, {"key": "B", "text": "Is"}, {"key": "C", "text": "Do"}, {"key": "D", "text": "Are"}], "correct": "Do", "explanation": "الفعل do يُستخدم لأن الفاعل your parents جمع في المضارع البسيط عند تكوين سؤال."}, {"question": "2. We will miss the bus if we ________ late.", "options": [{"key": "A", "text": "will be"}, {"key": "B", "text": "are"}, {"key": "C", "text": "were"}, {"key": "D", "text": "be"}], "correct": "are", "explanation": "الفعل are صحيح لأن جملة الشرط الأولى تكون (if + present simple)."}, {"question": "3. She prefers ________ documentaries in her free time.", "options": d) تأتي مع (in + gerund)."}, {"question": "10. We’d rather ________ at home tonight.", "options": [{"key": "A", "text": "stays"}, {"key": "B", "text": "staying"}, {"key": "C", "text": "stayed"}, {"key": "D", "text": "stay"}], "correct": "stay", "explanation": "الفعل stayلأن القاعدة (would rather + base verb)."}, {"question": "11. When metal gets hot, it ________.", "options": [{"key": "A", "text": "expands"}, {"key": "B", "text": "expanded"}, {"key": "C", "text": "expanding"}, {"key": "D", "text": "expand"}], "correct": "expands", "explanation": "الفعل expandsلأن الجملة حقيقة علمية (zero conditional)."}, {"question": "12. He stopped ________ fast food to stay healthy.", "options": [{"key": "A", "text": "eat"}, {"key": "B", "text": "eats"}, {"key": "C", "text": "eating"}, {"key": "D", "text": "ate"}], "correct": "eating", "explanation": "الفعل eatingلأن (stop + gerund) تعني التوقف عن الفعل."}, {"question": "13. Can you give us ________ example, please?", "options": [{"key": "A", "text": "other"}, {"key": "B", "text": "others"}, {"key": "C", "text": "another"}, {"key": "D", "text": "those"}], "correct": "another", "explanation": "الكلمة anotherتعني واحد إضافي مفرد."}, {"question": "14. I like tea, but my friends ________.", "options": [{"key": "A", "text": "doesn’t"}, {"key": "B", "text": "don’t"}, {"key": "C", "text": "isn’t"}, {"key": "D", "text": "didn’t"}], "correct": "don’t", "explanation": "الفعل don’tيُستخدم مع فاعل جمع بدل تكرار الفعل بعد (but)."}, {"question": "15. She has worked here ________ four years.", "options": [{"key": "A", "text": "since"}, {"key": "B", "text": "for"}, {"key": "C", "text": "yet"}, {"key": "D", "text": "to"}], "correct": "for", "explanation": "حرف الجر forيُستخدم مع مدة زمنية."}, {"question": "16. They have lived in Riyadh ________ 2018.", "options": [{"key": "A", "text": "for"}, {"key": "B", "text": "to"}, {"key": "C", "text": "yet"}, {"key": "D", "text": "since"}], "correct": "since", "explanation": "حرف الجر sinceيُستخدم مع نقطة زمنية محددة."}]};

function pad2(n) { return String(n).padStart(2,'0'); }
function fmtTime(ms) {
  const total = Math.max(0, Math.floor(ms/1000));
  const m = Math.floor(total/60);
  const s = total % 60;
  return `${pad2(m)}:${pad2(s)}`;
}

let state = {
  modelKey: null,
  questions: [],
  idx: 0,
  startedAt: null,
  timerId: null,
  answers: [],
  correct: 0,
  wrong: 0,
};

const elScreen = document.getElementById('screen');
const elStats = document.getElementById('stats');
const elTime = document.getElementById('time');
const elCorrect = document.getElementById('correctCount');
const elWrong = document.getElementById('wrongCount');

function resetState() {
  state.modelKey = null;
  state.questions = [];
  state.idx = 0;
  state.startedAt = null;
  state.answers = [];
  state.correct = 0;
  state.wrong = 0;
  if (state.timerId) clearInterval(state.timerId);
  state.timerId = null;
  elStats.style.display = 'none';
}

function startTimer() {
  state.startedAt = Date.now();
  elStats.style.display = '';
  state.timerId = setInterval(() => {
    elTime.textContent = fmtTime(Date.now() - state.startedAt);
  }, 250);
}

function updateCounts() {
  elCorrect.textContent = state.correct;
  elWrong.textContent = state.wrong;
}

function esc(s) {
  return (s ?? '').replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderHome() {
  resetState();
  elScreen.innerHTML = `
    <div style="display:flex; flex-direction:column; gap:14px;">
      <div class="small">اختر أحد النموذجين:</div>
      <div class="grid">
        <button class="primary" onclick="pickModel('model1')">النموذج التدريبي الأول (16 سؤال)</button>
        <button class="primary" onclick="pickModel('model2')">النموذج التدريبي الثاني (16 سؤال)</button>
      </div>
      <div class="notice">سيظهر لك سؤال واحد فقط في كل مرة، وبعد اختيارك ستظهر لك الإجابة الصحيحة والشرح.</div>
    </div>
  `;
}

window.pickModel = function(modelKey) {
  state.modelKey = modelKey;
  state.questions = DB[modelKey];
  state.idx = 0;
  state.answers = [];
  state.correct = 0;
  state.wrong = 0;
  startTimer();
  updateCounts();
  renderQuestion();
};

function renderQuestion() {
  const q = state.questions[state.idx];
  const progress = `${state.idx+1} / ${state.questions.length}`;
  const options = q.options || [];

  elScreen.innerHTML = `
    <div class="qhead">
      <div>
        <div class="qnum">السؤال: ${progress}</div>
        <div class="qtext">${esc(q.question)}</div>
      </div>
      <button class="mutedbtn" onclick="renderHome()">إنهاء وإعادة البدء</button>
    </div>

    <div class="choices">
      ${options.map(opt => `
        <div class="choice">
          <div class="badge">${esc(opt.key)}</div>
          <button onclick="chooseAnswer('${esc(opt.key)}')">
            <span class="choiceText">${esc(opt.text)}</span>
            <span class="choiceMeta">اختر</span>
          </button>
        </div>
      `).join('')}
    </div>

    <div id="feedback"></div>
  `;
}

window.chooseAnswer = function(pickedKey) {
  const q = state.questions[state.idx];
  const picked = (q.options || []).find(o => o.key === pickedKey);
  const pickedText = picked ? picked.text : '';
  const isCorrect = (pickedText || '').trim() === (q.correct || '').trim();

  if (state.answers[state.idx]) return;

  state.answers[state.idx] = {
    qIndex: state.idx,
    pickedKey,
    pickedText,
    isCorrect,
    correctText: q.correct,
    explanation: q.explanation,
    question: q.question,
    options: q.options
  };

  if (isCorrect) state.correct += 1;
  else state.wrong += 1;
  updateCounts();

  document.querySelectorAll('.choice button').forEach(b => b.disabled = true);

  const fb = document.getElementById('feedback');
  fb.innerHTML = `
    <div class="feedback ${isCorrect ? 'good' : 'bad'}">
      <div class="fbTitle">
        <b>${isCorrect ? '✅ إجابة صحيحة' : '❌ إجابة خاطئة'}</b>
        <span class="small">الإجابة الصحيحة: <span class="ltr"><b>${esc(q.correct)}</b></span></span>
      </div>
      <div class="explain">${esc(q.explanation)}</div>
      <div class="nav">
        <button class="primary" onclick="nextQ()">التالي</button>
        <button class="mutedbtn" onclick="goSummary()">إنهاء وعرض الملخص</button>
      </div>
    </div>
  `;
}

window.nextQ = function() {
  if (state.idx < state.questions.length - 1) {
    state.idx += 1;
    renderQuestion();
  } else {
    goSummary();
  }
}

window.goSummary = function() {
  if (state.timerId) clearInterval(state.timerId);
  state.timerId = null;
  const elapsed = state.startedAt ? (Date.now() - state.startedAt) : 0;

  const answeredCount = state.answers.filter(Boolean).length;
  const total = state.questions.length;

  const items = state.questions.map((q, i) => {
    const a = state.answers[i];
    const isAnswered = !!a;
    const tag = !isAnswered ? '<span class="tag">غير مُجاب</span>' : (a.isCorrect ? '<span class="tag good">صحيح</span>' : '<span class="tag bad">خطأ</span>');
    const pickedLine = !isAnswered
      ? '<div class="small">إجابتك: —</div>'
      : `<div class="small">إجابتك: <span class="ltr"><b>${esc(a.pickedKey)}) ${esc(a.pickedText)}</b></span></div>`;
    const correctLine = `<div class="small">الإجابة الصحيحة: <span class="ltr"><b>${esc(q.correct)}</b></span></div>`;
    const optsLine = (q.options || []).map(o => `<span class="ltr">${esc(o.key)}) ${esc(o.text)}</span>`).join(' &nbsp; | &nbsp; ');

    return `
      <div class="summaryItem">
        <div class="summaryTop">
          <div>
            <div class="qtext" style="font-size:16px; margin:0 0 6px 0;">${esc(q.question)}</div>
            <div class="small ltr">${optsLine}</div>
          </div>
          ${tag}
        </div>
        ${pickedLine}
        ${correctLine}
        <div class="explain" style="margin-top:8px;">${esc(q.explanation)}</div>
      </div>
    `;
  }).join('');

  elScreen.innerHTML = `
    <div style="display:flex; flex-direction:column; gap:12px;">
      <div class="qhead" style="margin-bottom:0;">
        <div>
          <div class="qnum">النتيجة النهائية</div>
          <div style="display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:6px;">
            <div class="pill">النموذج: <b>${state.modelKey === 'model1' ? 'الأول' : 'الثاني'}</b></div>
            <div class="pill">الوقت المستغرق: <b>${fmtTime(elapsed)}</b></div>
            <div class="pill">المُجاب: <b>${answeredCount} / ${total}</b></div>
            <div class="pill">✅ صحيح: <b>${state.correct}</b></div>

      </div>

      <div class="notice">أدناه ملخص بجميع الأسئلة مع إجاباتك والشرح.</div>

      <div>${items}</div>
    </div>
  `;

  elStats.style.display = '';
  elTime.textContent = fmtTime(elapsed);
  updateCounts();
}

renderHome();

function pad2(n){ return String(n).padStart(2,'0'); }
function fmtTime(ms){ const t=Math.max(0, Math.floor(ms/1000)); const m=Math.floor(t/60); const s=t%60; return pad2(m)+":"+pad2(s); }
function esc(s){ return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }

let state={
  testKey:null, test:null,
  idx:0, startedAt:null, timerId:null,
  correct:0, wrong:0,
  answers:[],
  showAr:false,
  // matching
  selectedWord:null, selectedDef:null,
  wordToDef:{}, defToWord:{},
  // matching attempt counters
  attempts:{} // wordIndex -> wrong attempts
};

const elScreen=document.getElementById('screen');
const elStats=document.getElementById('stats');
const elTime=document.getElementById('time');
const elCorrect=document.getElementById('correctCount');
const elWrong=document.getElementById('wrongCount');

function resetState(){
  state.testKey=null; state.test=null; state.idx=0;
  state.startedAt=null; state.correct=0; state.wrong=0; state.answers=[];
  state.showAr=false;
  state.selectedWord=null; state.selectedDef=null;
  state.wordToDef={}; state.defToWord={}; state.attempts={};
  if(state.timerId) clearInterval(state.timerId);
  state.timerId=null;
  elStats.style.display='none';
}
function startTimer(){
  state.startedAt=Date.now();
  elStats.style.display='';
  state.timerId=setInterval(()=>{ elTime.textContent = fmtTime(Date.now()-state.startedAt); }, 250);
}
function updateCounts(){ elCorrect.textContent=state.correct; elWrong.textContent=state.wrong; }

window.toggleAr = function(){ state.showAr=!state.showAr; renderScreen(true); };

function headerBlock(title, progress){
  const tLabel = state.showAr ? "إخفاء الترجمة" : "ترجمة";
  return `
    <div class="qhead">
      <div><div class="qnum">${esc(title)} — ${esc(progress)}</div></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button class="mutedbtn tbtn" onclick="toggleAr()">${tLabel}</button>
        <button class="mutedbtn tbtn" onclick="togglePreview()">Preview</button>
        <button class="mutedbtn" onclick="renderHome()">خروج</button>
      </div>
    </div>
  `;
}

function renderHome(){
  resetState();
  const buttons = Object.keys(DB).map(k => `<button class="primary" onclick="pickTest('${k}')">${esc(DB[k].title)}</button>`).join("");
  elScreen.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:14px;">
      <div class="small">اختر نوع الاختبار:</div>
      <div class="grid">${buttons}</div>
      <div class="previewBox" id="previewBox" style="display:none;"></div>
      <div class="notice">ملاحظة: تنويع الإجابة الصحيحة في الاختيار تم عبر إعادة ترتيب الخيارات فقط.</div>
    </div>
  `;
}
window.pickTest = function(key){
  state.testKey=key; state.test=DB[key];
  state.idx=0; state.correct=0; state.wrong=0; state.answers=[];
  state.showAr=false;
  state.selectedWord=null; state.selectedDef=null; state.wordToDef={}; state.defToWord={}; state.attempts={};
  startTimer(); updateCounts();
  renderScreen();
}

function renderScreen(keep=false){
  if(!state.test) return renderHome();
  if(state.test.type==="mcq") return renderMCQ(keep);
  return renderMatch(keep);
}

function renderMCQ(keep=false){
  const items=state.test.items || [];
  const it=items[state.idx];
  const progress = "السؤال: " + (state.idx+1) + " / " + items.length;

  const optsHtml = (it.options||[]).map(o => `
    <div class="choice">
      <div class="badge">${esc(o.key)}</div>
      <button onclick="chooseMCQ('${esc(o.key)}')">
        <span>
          <span class="choiceText">${esc(o.en)}</span>
          ${state.showAr && o.ar ? `<div class="small" style="margin-top:4px;">${esc(o.ar)}</div>` : ""}
        </span>
        <span class="choiceMeta">اختر</span>
      </button>
    </div>
  `).join("");

  elScreen.innerHTML = `
    ${headerBlock(state.test.title, progress)}
    <div class="qtext">${esc(it.q_en)}</div>
    ${state.showAr && it.q_ar ? `<div class="artext">${esc(it.q_ar)}</div>` : ""}
    <div class="choices">${optsHtml}</div>
    <div id="feedback"></div>
    <div class="previewBox" id="previewBox" style="display:none;"></div>
  `;
  if(keep) restoreMCQFeedback();
}

function lockChoices(){ document.querySelectorAll('.choice button').forEach(b=>b.disabled=true); }
function setFeedback(html){ const fb=document.getElementById('feedback'); if(fb) fb.innerHTML=html; }
function restoreMCQFeedback(){ const a=state.answers[state.idx]; if(!a) return; lockChoices(); setFeedback(a.feedbackHtml); }

window.chooseMCQ = function(key){
  if(state.answers[state.idx]) return;
  const it = (state.test.items||[])[state.idx];
  const picked = (it.options||[]).find(o=>o.key===key);
  const isCorrect = key === it.correct_key;
  if(isCorrect) state.correct++; else state.wrong++;
  updateCounts();
  lockChoices();

  const correctOpt = (it.options||[]).find(o=>o.key===it.correct_key) || {en:it.correct_en, ar:it.correct_ar};
  const correctLine = `<span class="ltr"><b>${esc(it.correct_key)}) ${esc(correctOpt.en||"")}</b></span>` + (state.showAr && correctOpt.ar ? ` <span class="small">— ${esc(correctOpt.ar)}</span>` : "");

  const fbHtml = `
    <div class="feedback ${isCorrect?'good':'bad'}">
      <div class="fbTitle"><b>${isCorrect?'✅ إجابة صحيحة':'❌ إجابة خاطئة'}</b><span class="small">الصحيح: ${correctLine}</span></div>
      <div class="nav">
        <button class="primary" onclick="nextMCQ()">التالي</button>
        <button class="mutedbtn" onclick="goSummary()">الملخص</button>
      </div>
    </div>
  `;
  setFeedback(fbHtml);
  state.answers[state.idx] = {
    pickedKey:key, pickedEn:(picked?.en||""), pickedAr:(picked?.ar||""),
    isCorrect:isCorrect,
    correctKey:it.correct_key, correctEn:(correctOpt.en||""), correctAr:(correctOpt.ar||""),
    promptEn:it.q_en, promptAr:it.q_ar,
    feedbackHtml:fbHtml
  };
}

window.nextMCQ = function(){
  if(state.idx < (state.test.items||[]).length - 1){ state.idx++; renderMCQ(); }
  else { goSummary(); }
}

/* Matching with immediate green/red highlight */
function renderMatch(keep=false){
  const words=state.test.words || [];
  const defs=state.test.defs || [];
  const total=words.length;
  const matched=Object.keys(state.wordToDef).length;
  const progress = "تمت المزاوجة الصحيحة: " + matched + " / " + total;

  const wordList = words.map((w, idx) => {
    const chosen = state.wordToDef[idx];
    const isActive = state.selectedWord === idx;
    const isDone = chosen !== undefined;
    return `
      <div class="choice">
        <div class="badge">${idx+1}</div>
        <button id="wbtn_${idx}" class="itemBtn ${isActive?'active':''} ${isDone?'done':''}" onclick="selectWord(${idx})" ${isDone?'disabled':''}>
          <span>
            <span class="choiceText">${esc(w.word_en)}</span>
            ${state.showAr && w.word_ar ? `<div class="small" style="margin-top:4px;">${esc(w.word_ar)}</div>` : ""}
          </span>
          <span class="choiceMeta">${isDone ? ("→ " + esc(chosen)) : "اختر"}</span>
        </button>
      </div>
    `;
  }).join("");

  const defList = defs.map(d => {
    const usedBy = state.defToWord[d.letter];
    const isActive = state.selectedDef === d.letter;
    const isDone = usedBy !== undefined;
    return `
      <div class="choice">
        <div class="badge">${esc(d.letter)}</div>
        <button id="dbtn_${esc(d.letter)}" class="itemBtn ${isActive?'active':''} ${isDone?'done':''}" onclick="selectDef('${esc(d.letter)}')" ${isDone?'disabled':''}>
          <span>
            <span class="choiceText">${esc(d.en)}</span>
            ${state.showAr && d.ar ? `<div class="small" style="margin-top:4px;">${esc(d.ar)}</div>` : ""}
          </span>
          <span class="choiceMeta">${isDone ? "مُستخدم" : "اختر"}</span>
        </button>
      </div>
    `;
  }).join("");

  elScreen.innerHTML = `
    ${headerBlock(state.test.title, progress)}
    <div class="matchWrap">
      <div class="col"><div class="colTitle">الكلمات</div><div class="list">${wordList}</div></div>
      <div class="col"><div class="colTitle">التعاريف</div><div class="list">${defList}</div></div>
    </div>
    <div id="feedback"></div>
    <div class="nav" style="margin-top:12px;">
      <button class="primary" onclick="finalizeMatching()" ${matched===total ? "" : "disabled"}>إنهاء وحساب النتيجة</button>
      <button class="mutedbtn" onclick="resetMatching()">إعادة ضبط</button>
      <button class="mutedbtn" onclick="goSummary()">الملخص</button>
    </div>
    <div class="previewBox" id="previewBox" style="display:none;"></div>
  `;
}

window.selectWord = function(idx){ state.selectedWord = idx; renderMatch(true); }
window.selectDef = function(letter){
  state.selectedDef = letter;
  if(state.selectedWord !== null && state.selectedDef !== null){
    const wIdx = state.selectedWord;
    const ltr = state.selectedDef;

    const words = state.test.words || [];
    const correct = (words[wIdx] || {}).correct_letter;
    const wEl = document.getElementById("wbtn_"+wIdx);
    const dEl = document.getElementById("dbtn_"+ltr);

    const ok = ltr === correct;

    // Visual flash
    if(ok) {
      wEl?.classList.add("flashGood");
      dEl?.classList.add("flashGood");
    } else {
      wEl?.classList.add("flashBad");
      dEl?.classList.add("flashBad");
    }

    setTimeout(()=>{
      wEl?.classList.remove("flashGood","flashBad");
      dEl?.classList.remove("flashGood","flashBad");

      if(ok) {
        // lock in
        state.wordToDef[wIdx]=ltr;
        state.defToWord[ltr]=wIdx;
        state.correct++;
        updateCounts();
        setFeedback(`<div class="feedback good"><div class="fbTitle"><b>✅ صحيح</b><span class="small">تمت المزاوجة بنجاح</span></div></div>`);
      } else {
        // count wrong attempt, allow retry
        state.wrong++;
        state.attempts[wIdx] = (state.attempts[wIdx]||0)+1;
        updateCounts();
        setFeedback(`<div class="feedback bad"><div class="fbTitle"><b>❌ خطأ</b><span class="small">جرّب مرة أخرى</span></div></div>`);
      }

      state.selectedWord=null;
      state.selectedDef=null;
      renderMatch(true);
    }, 350);
  } else {
    renderMatch(true);
  }
}

window.resetMatching = function(){
  state.selectedWord=null; state.selectedDef=null; state.wordToDef={}; state.defToWord={}; state.attempts={};
  state.correct=0; state.wrong=0; state.answers=[];
  updateCounts();
  renderMatch();
}

window.finalizeMatching = function(){
  // build answers list for summary
  const words = state.test.words || [];
  state.answers = words.map((w, idx)=>({
    wordEn:w.word_en, wordAr:w.word_ar,
    picked: state.wordToDef[idx],
    correct: w.correct_letter,
    ok: state.wordToDef[idx] === w.correct_letter,
    wrongAttempts: state.attempts[idx] || 0
  }));
  goSummary();
}

/* Summary */
window.goSummary = function(){
  if(state.timerId) clearInterval(state.timerId);
  state.timerId=null;
  const elapsed = state.startedAt ? (Date.now() - state.startedAt) : 0;

  let total=0, answered=0;
  if(state.test.type==="mcq"){ total=(state.test.items||[]).length; answered=state.answers.filter(Boolean).length; }
  else { total=(state.test.words||[]).length; answered=Object.keys(state.wordToDef).length; }

  let itemsHtml="";
  if(state.test.type==="mcq"){
    itemsHtml = (state.test.items||[]).map((it, idx)=>{
      const a=state.answers[idx];
      const tag = !a ? '<span class="tag">غير مُجاب</span>' : (a.isCorrect ? '<span class="tag good">صحيح</span>' : '<span class="tag bad">خطأ</span>');
      const correctOpt = (it.options||[]).find(o=>o.key===it.correct_key) || {en:it.correct_en, ar:it.correct_ar};
      const pickedLine = !a ? '<div class="small">إجابتك: —</div>' :
        `<div class="small">إجابتك: <span class="ltr"><b>${esc(a.pickedKey)}) ${esc(a.pickedEn)}</b></span>${state.showAr && a.pickedAr ? ` — ${esc(a.pickedAr)}` : ""}</div>`;
      const correctLine = `<div class="small">الصحيح: <span class="ltr"><b>${esc(it.correct_key)}) ${esc(correctOpt.en||"")}</b></span>${state.showAr && correctOpt.ar ? ` — ${esc(correctOpt.ar)}` : ""}</div>`;
      return `
        <div class="summaryItem">
          <div class="summaryTop">
            <div>
              <div class="qtext" style="font-size:16px;margin:0 0 6px 0;">${esc(it.q_en)}</div>
              ${state.showAr && it.q_ar ? `<div class="small">${esc(it.q_ar)}</div>` : ""}
            </div>
            ${tag}
          </div>
          ${pickedLine}
          ${correctLine}
        </div>
      `;
    }).join("");
  } else {
    const defs = state.test.defs || [];
    itemsHtml = (state.test.words||[]).map((wrd, idx)=>{
      const picked = state.wordToDef[idx];
      const ok = picked === wrd.correct_letter;
      const tag = picked===undefined ? '<span class="tag">غير مُجاب</span>' : (ok ? '<span class="tag good">صحيح</span>' : '<span class="tag bad">خطأ</span>');
      const pickedDef = defs.find(d=>d.letter===picked) || {};
      const correctDef = defs.find(d=>d.letter===wrd.correct_letter) || {};
      const wrongAtt = state.attempts[idx] || 0;

      const pickedLine = picked===undefined ? '<div class="small">إجابتك: —</div>' :
        `<div class="small">إجابتك: <span class="ltr"><b>${esc(picked)}) ${esc(pickedDef.en||"")}</b></span>${state.showAr && pickedDef.ar ? ` — ${esc(pickedDef.ar)}` : ""}</div>`;
      const correctLine = `<div class="small">الصحيح: <span class="ltr"><b>${esc(wrd.correct_letter)}) ${esc(correctDef.en||"")}</b></span>${state.showAr && correctDef.ar ? ` — ${esc(correctDef.ar)}` : ""}</div>`;
      const attemptsLine = `<div class="small">محاولات خاطئة على هذا البند: <b>${wrongAtt}</b></div>`;

      return `
        <div class="summaryItem">
          <div class="summaryTop">
            <div>
              <div class="qtext" style="font-size:16px;margin:0 0 6px 0;">${esc(wrd.word_en)}</div>
              ${state.showAr && wrd.word_ar ? `<div class="small">${esc(wrd.word_ar)}</div>` : ""}
            </div>
            ${tag}
          </div>
          ${pickedLine}
          ${correctLine}
          ${attemptsLine}
        </div>
      `;
    }).join("");
  }

  const tLabel = state.showAr ? "إخفاء الترجمة" : "ترجمة";
  elScreen.innerHTML = `
    <div style="display:flex;flex-direction:column;gap:12px;">
      <div class="qhead" style="margin-bottom:0;">
        <div>
          <div class="qnum">النتيجة النهائية — ${esc(state.test.title)}</div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px;">
            <div class="pill">الوقت المستغرق: <b>${fmtTime(elapsed)}</b></div>
            <div class="pill">المُجاب: <b>${answered} / ${total}</b></div>
            <div class="pill">✅ صحيح: <b>${state.correct}</b></div>
            <div class="pill">❌ خطأ: <b>${state.wrong}</b></div>
          </div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <button class="mutedbtn tbtn" onclick="toggleAr()">${tLabel}</button>
          <button class="mutedbtn tbtn" onclick="togglePreview()">Preview</button>
          <button class="primary" onclick="renderHome()">ابدأ من جديد</button>
        </div>
      </div>
      <div class="previewBox" id="previewBox" style="display:none;"></div>
      <div class="notice">ملخص الإجابات (استخدم زر «ترجمة» لإظهار/إخفاء العربية).</div>
      <div>${itemsHtml}</div>
    </div>
  `;
  elStats.style.display='';
  elTime.textContent=fmtTime(elapsed);
  updateCounts();
}

/* Preview helper panel */
window.togglePreview = function(){
  const box = document.getElementById('previewBox');
  if(!box) return;
  const visible = box.style.display !== 'none';
  if(visible) { box.style.display='none'; return; }

  box.style.display='block';
  box.innerHTML = `
    <div class="small" style="margin-bottom:8px;">ضع رابط <b>RAW</b> بعد ما ترفع الملف على GitHub (أو أي استضافة) وسيعطيك رابط Preview جاهز لتيليقرام:</div>
    <input id="rawUrl" type="text" placeholder="مثال: https://raw.githubusercontent.com/USER/REPO/main/vocab_quiz_tool_preview.html" />
    <div class="copyRow">
      <button class="primary" onclick="makePreview()">إنشاء رابط Preview</button>
      <button class="mutedbtn" onclick="copyPreview()">نسخ</button>
    </div>
    <div class="notice">سيظهر الرابط هنا:</div>
    <div id="previewOut" class="mono" style="word-break:break-all;"></div>
    <div class="notice">صيغة Preview المستخدمة: <span class="mono">https://htmlpreview.github.io/? + RAW_URL</span></div>
  `;
}

window.makePreview = function(){
  const raw = document.getElementById('rawUrl')?.value?.trim() || "";
  const out = document.getElementById('previewOut');
  if(!out) return;
  if(!raw) { out.textContent = "ضع رابط RAW أولاً."; return; }
  out.textContent = "https://htmlpreview.github.io/?" + raw;
}

window.copyPreview = async function(){
  const text = document.getElementById('previewOut')?.textContent || "";
  if(!text) return;
  try {
    await navigator.clipboard.writeText(text);
    alert("تم النسخ ✅");
  } catch(e) {
    alert("ما قدر ينسخ (جرّب نسخة يدويًا).");
  }
}

renderHome();
<\/script>
</body>
</html>
`,
};

function showTool(which) {
  document.getElementById('btnGrammar').classList.toggle('active', which === 'grammar');
  document.getElementById('btnVocab').classList.toggle('active', which === 'vocab');
  const frame = document.getElementById('toolFrame');
  frame.srcdoc = TOOLS[which];
}

showTool('grammar');
</script>
</body>
</html>
