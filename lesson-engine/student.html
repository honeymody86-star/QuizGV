<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>كويز الدرس</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1830;--card:#18244a;--text:#fff;--muted:#b9c5e8;--ok:#1e9e5a;--no:#d64545}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#eef3fb;--card:#fff;--text:#14213d;--muted:#5b6785}}
*{box-sizing:border-box}body{margin:0;font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px;line-height:1.6}
.wrap{max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:18px;padding:18px;box-shadow:0 8px 30px rgba(0,0,0,.15);margin:12px 0}
h1{font-size:22px;margin:0 0 4px}.muted{color:var(--muted);font-size:14px}
input{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid #8892b0;font-size:18px}
button{font:inherit;border:0;border-radius:14px;padding:14px;font-size:18px;font-weight:700;cursor:pointer;width:100%;margin:6px 0;color:#fff}
.go{background:#0f7b6c}
.opt{display:flex;gap:10px;align-items:center;text-align:right}
.opt b{background:rgba(255,255,255,.25);border-radius:8px;padding:0 10px}
.c0{background:#d62839}.c1{background:#1f6feb}.c2{background:#c88a04}.c3{background:#1e8e3e}
.opt.dim{opacity:.35}.opt.right{outline:4px solid #fff}
.fb{border-radius:12px;padding:10px 12px;margin-top:8px;font-weight:700}
.fb.ok{background:rgba(30,158,90,.2);color:#3ddc84}.fb.no{background:rgba(214,69,69,.2);color:#ff8080}
.prog{height:8px;background:rgba(127,127,127,.25);border-radius:9px;overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:#2cc4ac}
.big{font-size:56px;font-weight:900;text-align:center}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#888;vertical-align:middle}
.credit{text-align:center;font-size:12px;color:var(--muted);margin-top:18px}
.self label{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid rgba(127,127,127,.2)}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card">جارٍ التحميل…</div></div>
<div class="credit">محرك الدروس المتميزة — من إعداد: أ. محمد عطية الزهراني — مدرسة عثمان بن عفان الثانوية</div>
<script src="vendor/lz-string.min.js"></script>
<script>
(function(){
  const app=document.getElementById('app');
  const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const P=new URLSearchParams(location.hash.slice(1));
  let D; try{ D=JSON.parse(LZString.decompressFromEncodedURIComponent(P.get('d')||'')); }catch(e){}
  if(!D||!D.q){ app.innerHTML='<div class="card"><h1>⚠️ الرابط غير مكتمل</h1><p class="muted">اطلب من معلمك عرض رمز QR مرة أخرى.</p></div>'; return; }
  const host=P.get('h'); let conn=null, name='';
  const send=o=>{ try{ if(conn&&conn.open) conn.send(o); }catch(e){} };
  function connect(){
    if(!host) return;
    const s=document.createElement('script'); s.src='vendor/peerjs.min.js';
    s.onload=()=>{ try{ const p=new Peer(); p.on('open',()=>{ conn=p.connect(host,{reliable:true}); conn.on('open',()=>{ send({type:'join',name}); const d=document.getElementById('dot'); if(d) d.style.background='#2cc4ac'; }); }); }catch(e){} };
    document.head.appendChild(s);
  }
  let qi=0, score=0;
  function start(){
    app.innerHTML='<div class="card"><h1>📱 '+esc(D.t)+'</h1><p class="muted">'+esc(D.s||'')+' — كويز تفاعلي ('+D.q.length+' أسئلة)</p><input id="nm" placeholder="اكتب اسمك" autocomplete="name"><button class="go" id="go">ابدأ ←</button></div>';
    document.getElementById('go').onclick=()=>{ name=(document.getElementById('nm').value||'طالب').trim().slice(0,40); connect(); q(); };
  }
  function q(){
    if(qi>=D.q.length) return end();
    const [text,opts,correct]=D.q[qi];
    app.innerHTML='<div class="card"><div class="muted"><span class="dot" id="dot" style="background:'+(conn&&conn.open?'#2cc4ac':'#888')+'"></span> السؤال '+(qi+1)+' من '+D.q.length+' · '+esc(name)+'</div><div class="prog"><i style="width:'+(qi/D.q.length*100)+'%"></i></div><h1>'+esc(text)+'</h1>'+
      opts.map((o,i)=>'<button class="opt c'+i+'" data-i="'+i+'"><b>'+['A','B','C','D'][i]+'</b> '+esc(o)+'</button>').join('')+'<div id="fb"></div></div>';
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i));
  }
  function answer(i){
    const [,opts,correct,ex]=D.q[qi]; const ok=i===correct; if(ok) score++;
    send({type:'answer',qi,choice:i,ok});
    app.querySelectorAll('.opt').forEach(b=>{ b.disabled=true; const k=+b.dataset.i; if(k===correct) b.classList.add('right'); else if(k!==i) b.classList.add('dim'); });
    document.getElementById('fb').innerHTML='<div class="fb '+(ok?'ok':'no')+'">'+(ok?'✔ إجابة صحيحة! ':'✘ ليست صحيحة — الصحيح: '+esc(opts[correct])+'. ')+(ex?'<br><span style="font-weight:400">'+esc(ex)+'</span>':'')+'</div><button class="go" id="nx">'+(qi<D.q.length-1?'السؤال التالي ←':'النتيجة ←')+'</button>';
    document.getElementById('nx').onclick=()=>{ qi++; q(); };
  }
  function end(){
    const pct=Math.round(score/D.q.length*100);
    const msg=pct>=90?'🏆 أداء متميز! جرّب شرح فكرة الدرس لزميل.':pct>=70?'👏 أداء جيد، راجع السؤال الذي أخطأت فيه.':pct>=50?'🙂 بداية جيدة، راجع المفاهيم الرئيسة ثم أعد المحاولة.':'💪 لا بأس، الخطأ فرصة للتعلم — راجع الدرس وأعد المحاولة.';
    send({type:'done',score});
    app.innerHTML='<div class="card"><h1>نتيجتك يا '+esc(name)+'</h1><div class="big">'+score+' / '+D.q.length+'</div><p style="text-align:center">'+pct+'% — '+msg+'</p>'+
      ((D.x&&D.x.length)?'<div class="self"><h1 style="font-size:18px;margin-top:12px">🪞 قيّم نفسك</h1>'+D.x.map(s=>'<label>'+esc(s)+'<span>😀 🙂 😐</span></label>').join('')+'</div>':'')+
      '<button class="go" id="again">↺ أعد المحاولة</button></div>';
    document.getElementById('again').onclick=()=>{ qi=0; score=0; q(); };
  }
  start();
})();
</script>
</body>
</html>
